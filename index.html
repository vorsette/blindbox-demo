const MODES = [{ n: '盲盒墙', ask: K => `请点选 <b>${K}</b> 个`, build: wall }, { n: '拉绳', ask: K => `请拉 <b>${K}</b> 根绳`, build: rope }, { n: '刮刮乐', ask: K => `请刮开 <b>${K}</b> 格`, build: scratch }, { n: '捞扭蛋', ask: K => `请捞起 <b>${K}</b> 颗`, build: pond }];
